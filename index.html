<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>基本情報技術者試験 シラバス9.2 学習ツール</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 100%; margin: 0 auto; padding: 20px; background-color: #f4f4f9; font-size: 25px; }
        h1, h2 { color: #333; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .tabs { margin-bottom: 20px; }
        .tabs button { padding: 10px 20px; cursor: pointer; font-size: 25px; border: 1px solid #ccc; background: #fff; }
        .tabs button.active { background: #333; color: #fff; }
        .content { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        
        /* フィルター・検索エリア */
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input[type="text"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 20px; }
        .text_size { font-size: 20px; }
        
        /* 単語一覧のテーブル */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; transform: scale(1.5); margin: 5px; cursor: pointer; vertical-align: middle; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f8f8; cursor: pointer; font-size: 15px; }
        tr:nth-child(even) { background-color: #fafafa; }
        .category-tag { padding: 2px 6px; border-radius: 4px; font-size: 15px; color: #fff; }
        .tech { background: #007bff; } .mana { background: #28a745; } .stra { background: #ffc107; color: #000; }

        /* クイズエリア */
        #quiz-setup, #quiz-area { text-align: center; }
        .quiz-card { border: 2px solid #333; padding: 40px; margin: 20px 0; border-radius: 10px; min-height: 200px; position: relative; }
        .quiz-exclude-label { position: absolute; top: 15px; right: 20px; font-size: 18px; font-weight: bold; background: #fff0f0; padding: 5px 12px; border: 1px solid #ffaaaa; border-radius: 5px; cursor: pointer; }
        .question-text { font-size: 1.2em; font-weight: bold; margin-bottom: 20px; color: #555; margin-top: 10px; }
        .answer-text { font-size: 1.5em; color: #d9534f; margin: 20px 0; }
        .explanation-text { font-size: 1em; color: #666; background: #f9f9f9; padding: 10px; border-radius: 5px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-size: 25px; }
        .btn-primary { background: #333; color: #fff; }
        .btn-secondary { background: #ccc; }
    </style>
</head>
<body>

<h1>基本情報技術者試験 シラバス9.2 新用語</h1>

<div class="tabs">
    <button id="tab-list-btn" class="active" onclick="showTab('list')">単語一覧</button>
    <button id="tab-quiz-btn" onclick="showTab('quiz')">出題開始</button>
</div>

<!-- 単語一覧タブ -->
<div id="tab-list" class="content">
    <div class="controls">
        <input type="text" id="search-input" placeholder="検索（単語・説明）" oninput="renderList()">
        <select id="filter-category" onchange="renderList()" class="text_size">
            <option value="all">すべてのカテゴリ</option>
            <option value="テクノロジ">テクノロジ</option>
            <option value="マネジメント">マネジメント</option>
            <option value="ストラテジ">ストラテジ</option>
        </select>
        <span>出題対象外にチェック可能</span>
    </div>
    <table id="word-table">
        <thead>
            <tr>
                <th onclick="sortList('exclude')">除外</th>
                <th onclick="sortList('category')">カテゴリ</th>
                <th onclick="sortList('word')">単語</th>
                <th>問題・説明</th>
            </tr>
        </thead>
        <tbody id="word-list-body"></tbody>
    </table>
</div>
<!-- バックアップ・復元ボタン -->
<div style="margin: 10px 0; display: flex; gap: 10px;">
  <button onclick="exportData()" style="padding: 6px 12px; cursor: pointer;">データを保存（バックアップ）</button>
  <button onclick="importData()" style="padding: 6px 12px; cursor: pointer;">データを復元（読み込み）</button>
</div>
<!-- 出題開始タブ -->
<div id="tab-quiz" class="content hidden">
    <div id="quiz-setup">
        <h2>クイズ設定</h2>
        <div class="controls" style="justify-content: center;">
            <label>カテゴリ絞り込み:</label>
            <select id="quiz-category">
                <option value="all">すべて</option>
                <option value="テクノロジ">テクノロジ</option>
                <option value="マネジメント">マネジメント</option>
                <option value="ストラテジ">ストラテジ</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">クイズを開始する</button>
    </div>

    <div id="quiz-area" class="hidden">
        <div id="quiz-progress"></div>
        <div class="quiz-card">
            <!-- 出題中チェックボックス -->
            <label class="quiz-exclude-label">
                <input type="checkbox" id="quiz-exclude-checkbox" onchange="toggleCurrentQuestionExclude(this.checked)"> 出題対象外にする
            </label>
            <div id="quiz-question" class="question-text"></div>
            <div id="quiz-answer-container" class="hidden">
                <div class="answer-text">正解：<span id="quiz-answer"></span></div>
                <div id="quiz-explanation" class="explanation-text"></div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="prevQuestion()">前の問題へ</button>
            <button id="show-answer-btn" class="btn btn-primary" onclick="toggleAnswer()">答えを表示</button>
            <button class="btn btn-secondary" onclick="nextQuestion()">次の問題へ</button>
            <button class="btn btn-secondary" onclick="exitQuiz()">終了</button>
        </div>
    </div>
</div>

<script>
const termData = [    // --- テクノロジ系 [1] ---

    { category: "テクノロジ", word: "擬似相関", question: "第3の要因により見かけ上相関があるように見える関係を何と言うか", explanation: "実際には直接関係がないのに別の要因によって相関があるように見える関係です。", exclude: false },
    { category: "テクノロジ", word: "説明変数", question: "結果に影響を与える要因として用いられる変数を何と言うか", explanation: "モデルにおいて結果を説明するための入力側の変数です。特徴量に相当します。", exclude: false },

    { category: "テクノロジ", word: "名義尺度", question: "分類のみ可能で大小関係を持たない尺度を何というか", explanation: "性別や血液型など単なる分類を表す尺度です。平均との差や比率に意味はありません。", exclude: false },

    { category: "テクノロジ", word: "間隔尺度", question: "差は意味を持つが比率に意味がない尺度を何というか", explanation: "温度や西暦のように差は有効ですが、0が絶対的ではない尺度です。", exclude: false },
    { category: "テクノロジ", word: "比例尺度", question: "差も比率も意味を持つ尺度を何というか", explanation: "長さや重さ、金額など0が絶対基準となる尺度です。全ての数学的演算が可能です。", exclude: false },

    { category: "テクノロジ", word: "教師あり学習", question: "正解ラベル付きのデータで学習する機械学習手法を何というか", explanation: "入力と正解の組からモデルを学習します。分類や回帰問題で広く使われます。", exclude: false },
    { category: "テクノロジ", word: "教師なし学習", question: "正解ラベルなしのデータから構造を見つける学習手法を何というか", explanation: "データの分布や特徴を自動的に抽出します。クラスタリングや次元削減が代表的です。", exclude: false },

let currentQuizList = [];
let currentQuizIndex = 0;
let sortAsc = true;

// 1. ローカルストレージから保存された除外データ（exclude）を復元する関数
function loadSavedExcludes() {
    const saved = localStorage.getItem('taiyo_excludes');
    if (saved && typeof termData !== 'undefined') {
        const excludesMap = JSON.parse(saved);
        termData.forEach(item => {
            if (excludesMap[item.word] !== undefined) {
                item.exclude = excludesMap[item.word];
            }
        });
    }
}

// 2. 現在の除外状態（exclude）をローカルストレージに保存する関数
function saveExcludes() {
    if (typeof termData === 'undefined') return;
    const excludesMap = {};
    termData.forEach(item => {
        excludesMap[item.word] = !!item.exclude;
    });
    localStorage.setItem('taiyo_excludes', JSON.stringify(excludesMap));
}

// タブ切り替え
function showTab(tabName) {
    if (tabName === 'list') {
        document.getElementById('tab-list').classList.remove('hidden');
        document.getElementById('tab-quiz').classList.add('hidden');
        document.getElementById('tab-list-btn').classList.add('active');
        document.getElementById('tab-quiz-btn').classList.remove('active');
        renderList();
    } else {
        document.getElementById('tab-list').classList.add('hidden');
        document.getElementById('tab-quiz').classList.remove('hidden');
        document.getElementById('tab-list-btn').classList.remove('active');
        document.getElementById('tab-quiz-btn').active ? null : document.getElementById('tab-quiz-btn').classList.add('active');
    }
}

// 単語一覧の描画
function renderList() {
    const tbody = document.getElementById('word-list-body');
    const search = document.getElementById('search-input').value.toLowerCase();
    const categoryFilter = document.getElementById('filter-category').value;

    tbody.innerHTML = '';

    termData.forEach((item, index) => {
        if (categoryFilter !== 'all' && item.category !== categoryFilter) return;
        if (search && !item.word.toLowerCase().includes(search) && !item.question.toLowerCase().includes(search) && !item.explanation.toLowerCase().includes(search)) return;

        const tr = document.createElement('tr');
        
        let catClass = 'tech';
        if (item.category === 'マネジメント') catClass = 'mana';
        if (item.category === 'ストラテジ') catClass = 'stra';

        tr.innerHTML = `
            <td style="text-align:center;"><input type="checkbox" ${item.exclude ? 'checked' : ''} onchange="toggleExclude(${index}, this.checked)"></td>
            <td><span class="category-tag ${catClass}">${item.category}</span></td>
            <td><strong>${item.word}</strong></td>
            <td>
                <div><strong>問:</strong> ${item.question}</div>
                <div style="font-size: 0.85em; color: #555; margin-top: 5px;"><strong>解:</strong> ${item.explanation}</div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function toggleExclude(index, isChecked) {
    termData[index].exclude = isChecked;
    saveExcludes(); // チェック変更時に保存
}

function sortList(key) {
    termData.sort((a, b) => {
        let valA = a[key];
        let valB = b[key];
        if (typeof valA === 'boolean') {
            return sortAsc ? (valA === valB ? 0 : valA ? -1 : 1) : (valA === valB ? 0 : valA ? 1 : -1);
        }
        return sortAsc ? valA.localeCompare(valB, 'ja') : valB.localeCompare(a[key], 'ja');
    });
    sortAsc = !sortAsc;
    renderList();
}

// クイズ関連処理
function startQuiz() {
    const selectedCategory = document.getElementById('quiz-category').value;
    
    // 除外チェックが入っておらず、カテゴリ条件に合うものを抽出
    currentQuizList = termData.filter(item => {
        if (item.exclude) return false;
        if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;
        return true;
    });

    if (currentQuizList.length === 0) {
        alert('出題できる対象の単語がありません。（すべて除外されているか、カテゴリ内にデータがありません）');
        return;
    }

    // シャッフル
    currentQuizList.sort(() => Math.random() - 0.5);
    currentQuizIndex = 0;

    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    
    loadQuestion();
}

function loadQuestion() {
    const currentItem = currentQuizList[currentQuizIndex];
    
    document.getElementById('quiz-progress').innerText = `問題 ${currentQuizIndex + 1} / ${currentQuizList.length}`;
    document.getElementById('quiz-question').innerText = currentItem.question;
    document.getElementById('quiz-answer').innerText = currentItem.word;
    document.getElementById('quiz-explanation').innerText = currentItem.explanation;

    // 現在の除外状態をチェックボックスに反映
    document.getElementById('quiz-exclude-checkbox').checked = !!currentItem.exclude;

    // 解答エリアを非表示に戻す
    document.getElementById('quiz-answer-container').classList.add('hidden');
    document.getElementById('show-answer-btn').innerText = '答えを表示';
}

// 出題中の単語を除外更新する処理
function toggleCurrentQuestionExclude(isChecked) {
    if (currentQuizList.length === 0) return;
    const currentItem = currentQuizList[currentQuizIndex];
    currentItem.exclude = isChecked;
    saveExcludes(); // クイズ画面でチェック変更時にも保存
}

function toggleAnswer() {
    const container = document.getElementById('quiz-answer-container');
    const btn = document.getElementById('show-answer-btn');
    if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        btn.innerText = '答えを隠す';
    } else {
        container.classList.add('hidden');
        btn.innerText = '答えを表示';
    }
}

function nextQuestion() {
    if (currentQuizIndex < currentQuizList.length - 1) {
        currentQuizIndex++;
        loadQuestion();
    } else {
        alert('すべての問題が終了しました！');
    }
}

function prevQuestion() {
    if (currentQuizIndex > 0) {
        currentQuizIndex--;
        loadQuestion();
    }
}

function exitQuiz() {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('quiz-setup').classList.remove('hidden');
}
// データをJSONファイルとしてダウンロード（バックアップ）
function exportData() {
    const excludesMap = {};
    termData.forEach(item => {
        if (item.exclude) {
            excludesMap[item.word] = true;
        }
    });

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(excludesMap, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "taiyo_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// バックアップファイルを読み込んで復元
function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = readerEvent => {
            try {
                const content = readerEvent.target.result;
                const excludesMap = JSON.parse(content);
                
                // データを反映
                termData.forEach(item => {
                    item.exclude = !!excludesMap[item.word];
                });

                // ローカルストレージも更新
                saveExcludes();
                // 画面を再描画
                renderList();

                alert('データを正常に復元しました！');
            } catch (err) {
                alert('ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
            }
        };
        reader.readAsText(file, 'UTF-8');
    };

    input.click();
}
// 初期起動時の処理：保存データの読み込みと初描画
loadSavedExcludes();
renderList();
</script>
